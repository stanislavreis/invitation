<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Особое приглашение ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      backdrop-filter: blur(5px);
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    .heart {
      font-size: 50px;
      animation: pulse 1.2s infinite ease-in-out;
      margin-bottom: 15px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #d63384;
      font-size: 24px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 50px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-yes {
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
    }

    .btn-yes:hover {
      background-color: #218838;
      transform: scale(1.08);
    }

    .btn-no {
      background-color: #dc3545;
      color: white;
      position: absolute;
      /* Изначально справа от кнопки Да */
      left: 60%;
      transition: all 0.15s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">💖</div>
    <h1>Пойдём на свидание?</h1>
    <p>Я обещаю отличный вечер, вкусный кофе и классное настроение! Выберешь время?</p>
    
    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn">Да! 🥰</button>
      <button class="btn btn-no" id="noBtn">Нет 🙈</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');

    // Настройки для обратной связи в Telegram
    // Вариант 1: Замените 'stanislav_raise' на ваш логин без @
    const TELEGRAM_USERNAME = 'stanislav_raise';

    // Функция убегания кнопки "Нет"
    function moveButton() {
      // Ограничиваем область убегания видимым экраном
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      // Переводим в absolute от экрана
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // Реакция на наведение и касание (для телефонов)
    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButton();
    });

    // Действие при клике на "Да"
    yesBtn.addEventListener('click', () => {
      // Текст сообщения, с которым открывается диалог
      const message = encodeURIComponent("Привет! Я согласна на свидание! 🥰✨");
      
      // Перенаправляем прямо в личку Telegram
      window.location.href = `https://t.me/${TELEGRAM_USERNAME}?text=${message}`;
    });
  </script>
</body>
</html>
