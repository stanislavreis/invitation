<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Особое приглашение ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden; /* Важно, чтобы кнопка не создавала полосы прокрутки */
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      backdrop-filter: blur(5px);
      max-width: 400px;
      width: 90%;
      position: relative;
      z-index: 10; /* Карточка всегда поверх убегающей кнопки */
    }

    .heart {
      font-size: 50px;
      animation: pulse 1.2s infinite ease-in-out;
      margin-bottom: 15px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #d63384;
      font-size: 24px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      min-height: 50px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }

    .btn-yes {
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-yes:hover {
      background-color: #218838;
      transform: scale(1.1);
    }

    .btn-no {
  background-color: #dc3545; /* Красный цвет */
  color: white;
  
  /* КРИТИЧНО ВАЖНО: */
  position: fixed; /* Позиционирование относительно окна */
  z-index: 20;     /* ОЧЕНЬ ВАЖНО: Большое число, чтобы быть ПОВЕРХ карточки и всего остального */
  
  /* Начальное положение: чуть ниже центра экрана, чтобы её было видно */
  top: 65%; 
  left: 50%;
  transform: translate(-50%, -50%); /* Центрирование самой кнопки */
  
  /* Плавность движения */
  transition: all 0.3s ease-out; 
  
  /* Основные стили кнопки (чтобы не пропали) */
  padding: 12px 28px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 25px;
  cursor: pointer;
}
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="heart">💖</div>
    <h1>Пойдём на свидание?</h1>
    <p>Я обещаю отличный вечер, вкусный кофе и классное настроение!</p>
    
    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn">Да! 🥰</button>
      <!-- Кнопка Нет изначально находится вне контейнера кнопок в CSS -->
    </div>
  </div>

  <!-- Кнопка Нет вынесена сюда для корректного fixed позиционирования -->
  <button class="btn btn-no" id="noBtn">Нет 🙈</button>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const card = document.getElementById('mainCard');

    // !!! ВСТАВЬТЕ СВОИ ДАННЫЕ СЮДА !!!
    const BOT_TOKEN = '8857710803:AAEcr_NBmHmq68yjDAQk77u1U14a4vv4K4w'; 
    const CHAT_ID = '778704677';

    // Функция для получения случайного числа в диапазоне
    function getRandomNumber(min, max) {
      return Math.random() * (max - min) + min;
    }

    // Логика "плавного убегания"
    function moveButton() {
      // Размеры кнопки
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      // Размеры видимого окна браузера
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // Отступы от края, чтобы кнопка не уходила за экран
      const padding = 50;

      // Вычисляем новую случайную позицию, гарантированно внутри экрана
      let newX = getRandomNumber(padding, windowWidth - btnWidth - padding);
      let newY = getRandomNumber(padding, windowHeight - btnHeight - padding);

      // Применяем новые координаты. CSS transition (transition: all 0.3s) сделает движение плавным.
      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
      
      // Убираем transform, который использовался для начального центрирования
      noBtn.style.transform = 'none'; 
    }

    // Обработка наведения мыши (для ПК)
    noBtn.addEventListener('mouseover', moveButton);

    // Обработка касания (для мобильных) - на тачскринах лучше сразу перемещать
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault(); // Предотвращает "прокликивание"
      moveButton();
    });


    // Отправка уведомления при нажатии на "Да"
    yesBtn.addEventListener('click', () => {
      // Блокируем кнопку, чтобы не нажимали много раз
      yesBtn.disabled = true;
      yesBtn.innerText = "Секундочку...";

      const text = encodeURIComponent("🎉 Ура! Ответ: ДА! Пора планировать свидание! ❤️");
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}`;

      fetch(url)
        .then(response => {
          // Убираем кнопку "Нет" вообще
          noBtn.style.display = 'none';
          
          // Меняем содержимое карточки
          card.innerHTML = `
            <div class="heart">🥳</div>
            <h1>Ура! До встречи!</h1>
            <p>Я уже планирую наш вечер. Напишу тебе совсем скоро!</p>
          `;
        })
        .catch(error => {
          console.error('Ошибка отправки:', error);
          yesBtn.disabled = false;
          yesBtn.innerText = "Да! 🥰";
          alert('Ой, что-то сломалось при отправке уведомления. Но я всё равно жду!');
        });
    });
  </script>
</body>
</html>
