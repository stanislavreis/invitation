<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Особое приглашение ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      backdrop-filter: blur(5px);
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    .heart {
      font-size: 50px;
      animation: pulse 1.2s infinite ease-in-out;
      margin-bottom: 15px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #d63384;
      font-size: 24px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* Блок кнопок ограничивает движение */
    .buttons-container {
      position: relative;
      width: 100%;
      height: 120px; /* Выделяем зону под текстом для беготни */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
    }

    .btn {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }

    .btn-yes {
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
      transition: transform 0.2s, background-color 0.2s;
      z-index: 2;
    }

    .btn-yes:hover {
      background-color: #218838;
      transform: scale(1.1);
    }

    /* Кнопка НЕТ привязана к внутреннему блоку карточки */
    .btn-no {
      background-color: #dc3545;
      color: white;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
      position: absolute;
      /* Начальная позиция справа от кнопки "Да" */
      left: 55%;
      top: 0;
      transition: left 0.25s ease-out, top 0.25s ease-out;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="heart">💖</div>
    <h1>Пойдём на свидание?</h1>
    <p>Я обещаю отличный вечер, вкусный кофе и классное настроение!</p>
    
    <div class="buttons-container" id="container">
      <button class="btn btn-yes" id="yesBtn">Да! 🥰</button>
      <button class="btn btn-no" id="noBtn">Нет 🙈</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const card = document.getElementById('mainCard');
    const container = document.getElementById('container');

    const BOT_TOKEN = '8857710803:AAEcr_NBmHmq68yjDAQk77u1U14a4vv4K4w'; 
    const CHAT_ID = '778704677';

    function getRandomNumber(min, max) {
      return Math.random() * (max - min) + min;
    }

    function moveButton() {
      // Размеры контейнера под текстом
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;

      // Размеры самой кнопки
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      // Вычисляем новые случайные координаты СТРОГО внутри блока карточки
      const maxLeft = containerWidth - btnWidth;
      const maxHeight = containerHeight - btnHeight;

      const newLeft = getRandomNumber(0, Math.max(0, maxLeft));
      const newTop = getRandomNumber(0, Math.max(0, maxHeight));

      noBtn.style.left = `${newLeft}px`;
      noBtn.style.top = `${newTop}px`;
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButton();
    });

    yesBtn.addEventListener('click', () => {
      yesBtn.disabled = true;
      yesBtn.innerText = "Секундочку...";

      const text = encodeURIComponent("🎉 Ура! Ответ: ДА! Пора планировать свидание! ❤️");
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}`;

      fetch(url)
        .then(response => {
          noBtn.style.display = 'none';
          card.innerHTML = `
            <div class="heart">🥳</div>
            <h1>Ура! До встречи!</h1>
            <p>Я уже планирую наш вечер. Напишу тебе совсем скоро!</p>
          `;
        })
        .catch(error => {
          console.error('Ошибка отправки:', error);
          yesBtn.disabled = false;
          yesBtn.innerText = "Да! 🥰";
          alert('Произошла ошибка при отправке, но твой выбор принят!');
        });
    });
  </script>
</body>
</html>
